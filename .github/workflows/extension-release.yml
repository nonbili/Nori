name: Build extension

on:
  push:
    tags:
      - extension/v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # extension/ imports the repo-root components/, so the workspace install
      # has to happen at the root.
      - name: install
        run: bun install --frozen-lockfile

      - name: zip chrome & firefox
        run: bun run zip:all
        working-directory: extension

      - name: check
        run: bun run check
        working-directory: extension

      - uses: actions/upload-artifact@v6
        with:
          name: extension
          path: extension/.output/*.zip

      # The manifest version comes from extension/package.json, so the tag has
      # to agree with it and have a matching changelog.
      - name: resolve tag
        if: startsWith(github.ref, 'refs/tags/extension/v')
        run: |
          set -euo pipefail
          VER=$(jq -r '.version' extension/package.json)
          if [ "$GITHUB_REF_NAME" != "extension/v$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension/package.json (extension/v$VER)."
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/extension/v')
        with:
          name: Nori Extension ${{ env.VER }}
          body_path: extension/metadata/changelogs/v${{ env.VER }}.txt
          files: extension/.output/*.zip
          # The `latest` pointer belongs to the mobile app's `v*` releases.
          make_latest: "false"
