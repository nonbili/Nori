name: Build desktop

on:
  push:
    tags:
      # The desktop app carries its own version (desktop/version.txt), so it
      # releases on its own tag namespace and never collides with the `v*`
      # tags that drive the Android build.
      - 'desktop/v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: nori-linux-amd64
          - os: macos-15-intel
            artifact: nori-darwin-amd64
          - os: macos-15
            artifact: nori-darwin-arm64
          - os: windows-latest
            artifact: nori-windows-amd64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: install linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            libfuse2
          # 22.04 has no webkitgtk-6.0, so the Makefile's probe selects the
          # `gtk3` build tag — which is also what keeps the binary runnable on
          # older distributions.

      # The desktop frontend imports the repo-root components/ and extension/
      # sources, so the workspace install has to happen at the root.
      - name: install deps
        run: bun install --frozen-lockfile

      - name: build
        if: "!startsWith(matrix.os, 'windows')"
        run: make -C desktop build

      - name: build (windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < desktop/version.txt)
          (cd desktop/frontend && bun run build)

          # The icon and version info reach the exe through a .syso resource.
          # `generate syso` is the only part of the v3 CLI this build needs; the
          # rest of the packaging is done by hand (see desktop/README.md).
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15
          jq --arg v "$VER" '.fixed.file_version = $v | .info["0000"].ProductVersion = $v' \
            desktop/build/windows/info.json > "$RUNNER_TEMP/info.json"
          mv "$RUNNER_TEMP/info.json" desktop/build/windows/info.json
          (cd desktop/build && wails3 generate syso -arch amd64 \
            -icon windows/icon.ico \
            -manifest windows/wails.exe.manifest \
            -info windows/info.json \
            -out ../wails_windows_amd64.syso)

          # -H windowsgui keeps a console window from opening behind the app.
          (cd desktop && go build -ldflags "-H windowsgui" -o bin/nori.exe . && rm -f wails_windows_amd64.syso)

      # ---------------------------------------------------------------- macOS
      - name: import mac signing cert
        if: startsWith(matrix.os, 'macos')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::CSC_LINK not set — skipping signing cert import"
            exit 0
          fi
          CERTIFICATE_P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          case "$CSC_LINK" in
            http://*|https://*) curl -fsSL "$CSC_LINK" -o "$CERTIFICATE_P12" ;;
            file://*)           cp "${CSC_LINK#file://}" "$CERTIFICATE_P12" ;;
            *)                  printf '%s' "$CSC_LINK" | base64 -D > "$CERTIFICATE_P12" ;;
          esac

          security import "$CERTIFICATE_P12" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Wails v3's packaging Taskfiles are not generated for this project (see
      # desktop/README.md), so the bundle is assembled from build/darwin/ here.
      - name: assemble macOS app bundle
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < desktop/version.txt)
          APP="$RUNNER_TEMP/Nori.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp desktop/bin/nori "$APP/Contents/MacOS/nori"
          cp desktop/build/darwin/Info.plist "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$APP/Contents/Info.plist"

          iconset="$RUNNER_TEMP/icons.iconset"
          rm -rf "$iconset" && mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size desktop/build/appicon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) desktop/build/appicon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$APP/Contents/Resources/icons.icns"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: package macOS dmg
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="dist/${{ matrix.artifact }}.dmg"
          mkdir -p dist
          rm -rf "$DMG_ROOT" && mkdir -p "$DMG_ROOT"

          SIGNING_IDENTITY=""
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -n "${TEAM_ID:-}" ]; then
            SIGNING_IDENTITY="Developer ID Application: Nonbili Inc. ($TEAM_ID)"
            codesign --force --options runtime --timestamp --deep \
              --entitlements desktop/build/darwin/Entitlements.plist \
              --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          else
            echo "::warning::macOS signing secrets not set — producing an unsigned DMG"
          fi

          ditto "$APP_PATH" "$DMG_ROOT/Nori.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "Nori" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG_PATH"

          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" "$DMG_PATH"
            codesign --verify --verbose=4 "$DMG_PATH"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$TEAM_ID" --wait
              xcrun stapler staple "$DMG_PATH"
              xcrun stapler validate "$DMG_PATH"
            else
              echo "::warning::notarization secrets not set — skipping notarization"
            fi
          fi

      # The updater installs by swapping the .app in place, which needs a plain
      # archive: it unpacks .zip/.tar.gz and cannot open a DMG. The staple is
      # best-effort — a ticket for the enclosed app exists once the DMG it
      # shipped in was notarized, and an un-stapled app still passes Gatekeeper
      # on an online machine.
      - name: package macOS update zip
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          mkdir -p dist
          xcrun stapler staple "$APP_PATH" || echo "::warning::could not staple the .app — shipping it un-stapled"
          ditto -c -k --keepParent "$APP_PATH" "dist/${{ matrix.artifact }}-app.zip"

      # ---------------------------------------------------------------- Linux
      - name: package linux tarball
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C desktop/bin -czf "dist/${{ matrix.artifact }}.tar.gz" nori

      - name: package linux AppImage
        if: startsWith(matrix.os, 'ubuntu')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: dist/${{ matrix.artifact }}.AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          base="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          aibase="https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous"
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-appimage "$aibase/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          convert desktop/build/appicon.png -resize 512x512 "$RUNNER_TEMP/nori_512.png"

          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp desktop/bin/nori AppDir/usr/bin/nori
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/nori \
            --desktop-file desktop/build/linux/nori.desktop \
            --icon-file "$RUNNER_TEMP/nori_512.png" \
            --icon-filename nori

          # Ship no libraries: the app uses the host's GTK and WebKit.
          #
          # A bundled libwebkit2gtk cannot work off Debian/Ubuntu. It spawns its
          # helper processes from a path compiled into the library, and distro
          # builds compile out the WEBKIT_EXEC_PATH override, so on e.g. Fedora
          # it aborts with "Failed to spawn child process". Keeping the GTK/glib
          # stack while dropping only WebKit is worse: the host WebKit would
          # resolve glib against the older bundled copy and die on missing
          # symbols. So the AppImage carries just the binary and requires
          # webkit2gtk-4.1 on the host, which every distro that can run the
          # tarball already provides.
          rm -rf AppDir/usr/lib && mkdir -p AppDir/usr/lib

          # linuxdeploy re-resolves dependencies whenever it touches an AppDir,
          # so package via the plugin directly to keep usr/lib empty.
          ./linuxdeploy-plugin-appimage --appdir AppDir

      # -------------------------------------------------------------- Windows
      - name: install NSIS
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # choco updates the machine PATH, but the running job won't pick that
          # up in later steps; expose makensis to the build step explicitly.
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: package windows installer
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VER=$(tr -d '[:space:]' < desktop/version.txt)
          # project.nsi embeds the bootstrapper so a machine without the WebView2
          # runtime installs it during setup (online-only deployment).
          curl -fsSL -o desktop/build/windows/nsis/MicrosoftEdgeWebview2Setup.exe \
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          # Paths are relative to the .nsi directory, which keeps them valid as
          # Windows paths under Git bash.
          (cd desktop/build/windows/nsis && makensis \
            '-DARG_WAILS_AMD64_BINARY=..\..\..\bin\nori.exe' \
            "-DINFO_PRODUCTVERSION=$VER" \
            project.nsi)
          cp desktop/bin/nori-amd64-installer.exe "dist/${{ matrix.artifact }}.exe"

      - name: package windows portable zip
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          7z a "dist/${{ matrix.artifact }}-portable.zip" ./desktop/bin/nori.exe

      # --------------------------------------------------------------- upload
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: resolve tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < desktop/version.txt)
          DESKTOP_TAG="desktop/v$VER"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$DESKTOP_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/version.txt ($DESKTOP_TAG)."
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$DESKTOP_TAG" >> "$GITHUB_ENV"

      - name: prepare release note
        run: |
          set -euo pipefail
          sed "s/{VER}/$VER/g" desktop/metadata/changelogs/template.txt > note.txt
          printf '\n' >> note.txt
          cat "desktop/metadata/changelogs/v$VER.txt" >> note.txt

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Nori Desktop ${{ env.VER }}
          # The `latest` pointer belongs to the mobile app's `v*` releases.
          make_latest: false
          body_path: note.txt
          files: dist/*

      # The digests are signed with the Ed25519 key whose public half is
      # compiled into the app, so a manifest served from anywhere else — or one
      # edited in place — fails verification on the client.
      - name: generate update manifest
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_UPDATE_SIGNING_KEY:-}" ]; then
            echo "DESKTOP_UPDATE_SIGNING_KEY is not set — see desktop/README.md (scripts/gen-signing-key.sh)."
            exit 1
          fi
          KEY="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077 && printf '%s' "$DESKTOP_UPDATE_SIGNING_KEY" > "$KEY")
          DESKTOP_UPDATE_SIGNING_KEY_FILE="$KEY" desktop/scripts/gen-manifest.sh "$VER" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            dist > latest.json
          rm -f "$KEY"
          cat latest.json

      # The app polls the manifest at a fixed URL, so it lives on a rolling
      # release rather than the versioned one. Uploading it only after the
      # versioned release exists keeps the manifest from ever pointing at
      # assets that aren't published yet.
      - name: publish update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Desktop update manifest
          body: >-
            Rolling pointer to the newest desktop release, read by the in-app
            updater. Not a download — see the desktop/v* releases.
          make_latest: false
          files: latest.json
