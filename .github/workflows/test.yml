name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  desktop:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          # Browser tests skip without Chrome; require it on CI.
          command -v google-chrome
          google-chrome --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build embedded frontend
        run: bun run --cwd desktop/frontend build

      - name: Run desktop tests
        working-directory: desktop
        run: go test -tags gtk3 -count=1 -v ./...
