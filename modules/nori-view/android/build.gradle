plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'jp.nonbili.nori'
version = '0.0.1'

android {
  namespace "jp.nonbili.nori.view"
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  // Document start scripts, so a page's own scripts never run before ours.
  implementation "androidx.webkit:webkit:1.13.0"
}
